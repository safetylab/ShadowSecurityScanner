name: nse2pack

on:
  push:
    paths:
      - 'tools/nse2pack/**'
      - 'docs/check-pack/**'
      - '.github/workflows/nse2pack.yml'
  pull_request:
    paths:
      - 'tools/nse2pack/**'
      - 'docs/check-pack/**'
      - '.github/workflows/nse2pack.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No dependencies to install: the converter is standard library only.
      - name: Unit tests
        working-directory: tools/nse2pack
        run: python -m unittest discover -s tests -t . -q

      - name: Convert the fixtures, then inspect what was written
        working-directory: tools/nse2pack
        run: |
          python -m nse2pack tests/fixtures -o out --strict
          python -m nse2pack --check --strict $(ls out/*.json | grep -v report.json)
