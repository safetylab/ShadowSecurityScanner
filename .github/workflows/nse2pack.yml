name: nse2pack

on:
  push:
    paths:
      - 'tools/nse2pack/**'
      - 'docs/check-pack/**'
      - '.github/workflows/nse2pack.yml'
  pull_request:
    paths:
      - 'tools/nse2pack/**'
      - 'docs/check-pack/**'
      - '.github/workflows/nse2pack.yml'

jobs:
  tests:
    # 3.9 is the floor the converter supports; the current ubuntu-latest image no
    # longer ships it, so that leg runs on the last image that does.
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.9'
            runs-on: ubuntu-22.04
          - python-version: '3.12'
            runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No dependencies to install: the converter is standard library only.
      - name: Unit tests
        working-directory: tools/nse2pack
        run: python -m unittest discover -s tests -t . -q

      - name: Convert the fixtures, then inspect what was written
        working-directory: tools/nse2pack
        run: |
          python -m nse2pack tests/fixtures -o out --strict
          python -m nse2pack --check --strict $(ls out/*.json | grep -v report.json)
