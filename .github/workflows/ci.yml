name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Pinned rather than ubuntu-latest: the label moves to a new image on
    # GitHub's schedule, which changes what the build runs on without a commit.
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to a commit SHA. A tag such as @v4 can be moved by
      # the action's owner to different code, which would run here with the
      # job's token: the usual supply-chain path into a build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  vulncheck:
    # govulncheck reports known vulnerabilities reachable from this code,
    # including ones in the standard library of the Go version in use. There
    # are no third-party dependencies today, which is exactly why the standard
    # library is worth watching.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
